name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CI logic lives in estebancas/standards (reusable workflows). The job `name` values and the
  # reusable job ids form the required status check contexts (for example `Lint / lint`); see
  # docs/contract.md in that repo before renaming either.
  lint:
    name: Lint
    uses: estebancas/standards/.github/workflows/lint.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1
    with:
      # generate-icons is otherwise unexercised by CI, so a bad dev-tool bump (e.g. an ESM-only
      # major) would pass every other check. Regenerate and compare to the committed icons and
      # iOS splash images.
      generated-assets-command: npm run generate-icons
      generated-assets-path: public/
      generated-assets-required-files: |
        public/pwa-64x64.png
        public/pwa-192x192.png
        public/pwa-512x512.png
        public/maskable-icon-512x512.png
        public/apple-touch-icon-180x180.png
        public/favicon.ico
        public/apple-splash-*.png

  test:
    name: Unit tests + build
    uses: estebancas/standards/.github/workflows/test-build.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1

  mutation:
    name: Mutation testing
    uses: estebancas/standards/.github/workflows/mutation.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1

  audit:
    name: Dependency audit
    uses: estebancas/standards/.github/workflows/audit.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1
    with:
      # `braces` has no fix yet (see CLAUDE.md); drop this once the full audit is clean.
      audit-dev: true

  size:
    name: Bundle size
    needs: test
    uses: estebancas/standards/.github/workflows/size.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1

  e2e:
    name: End-to-end
    needs: test
    uses: estebancas/standards/.github/workflows/e2e.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1
    with:
      # Pinned to the installed @playwright/test version so the container's preinstalled
      # browsers and fonts match `npm ci`'s resolved version, and so visual regression
      # baselines (committed from the same image, see CLAUDE.md) render identically.
      container-image: mcr.microsoft.com/playwright:v1.63.0-noble

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://weekly-routine.estcascor94.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
